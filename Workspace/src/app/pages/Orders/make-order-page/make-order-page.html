<form [formGroup]="orderForm" (ngSubmit)="addToCart()" class="order-form">
  <h2 class="form-title">{{ editingOrderId ? 'Editar Pedido' : 'Sube tu archivo' }}</h2>

  <div class="file-section">
    <div class="file-input-wrapper" [class.has-file]="selectedFile || editingOrderId" 
         (click)="(!selectedFile && !editingOrderId) && fileInput.click()">
      
      <span class="material-icons upload-icon" *ngIf="!selectedFile && !editingOrderId">cloud_upload</span>
      
      <div class="file-info-display">
        <span class="file-name">{{ selectedFileName || 'Haz clic para subir un archivo' }}</span>
        <small class="file-meta" *ngIf="selectedFile || editingOrderId">
          <ng-container *ngIf="isPdf || (editingOrderId && selectedFileName.toLowerCase().endsWith('.pdf'))">
            {{ pageCount ?? '...' }} páginas
          </ng-container>
          <ng-container *ngIf="isImage">
            {{ imageWidth }}x{{ imageHeight }} px
          </ng-container>
        </small>
      </div>

      <button type="button" class="remove-file" *ngIf="selectedFile && !editingOrderId && !isLoading" 
        (click)="removeFile($event)">
        <span class="material-icons">close</span>
      </button>

      <input accept=".pdf,image/*" type="file" #fileInput (change)="onFileSelected($event)" id="fileUpload" hidden>
    </div>
  </div>

  <div class="form-grid">
    <div class="form-group">
      <label class="form-label">Tipo de Impresión</label>
      <div class="toggle-group">
        <button type="button" class="toggle-btn" [class.active]="!orderForm.get('color')?.value"
          (click)="orderForm.patchValue({color: false})">
          <span class="material-icons">brightness_medium</span> <span>B/N</span>
        </button>
        <button type="button" class="toggle-btn" [class.active]="orderForm.get('color')?.value"
          (click)="orderForm.patchValue({color: true})">
          <span class="material-icons">palette</span> <span>Color</span>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label label-with-icon" for="copies">
        Copias <span class="material-icons sm-icon">content_copy</span>
      </label>
        <input type="number" id="copies" formControlName="copies" min="1">
    </div>
  </div>

  <div class="options-grid">
    <div class="checkbox-card">
      <label class="form-label" for="doubleSided">
        Doble cara <span class="material-icons">import_export</span>
      </label>
      <input type="checkbox" id="doubleSided" formControlName="doubleSided">
    </div>

    <div class="form-group">
      <label class="form-label" for="binding">Anillado / Terminación</label>
      <select id="binding" formControlName="binding">
        <option value="NONE">Ninguno</option>
        <option value="RINGED">Anillado</option>
        <option value="STAPLED">Abrochado</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label" for="comments">Instrucciones especiales</label>
    <textarea id="comments" formControlName="comments" placeholder="Ej: Anillar por el margen izquierdo..."></textarea>
  </div>

  <div class="form-footer">
    <div class="price-display" *ngIf="calculatedPrice !== null">
      <span class="price-label">Total:</span>
      <span class="price-amount">${{ calculatedPrice | number:'1.2-2' }}</span>
    </div>

    <button type="submit" class="btn-submit" [disabled]="!orderForm.valid || (!selectedFile && !editingOrderId) || isLoading">
      <span class="material-icons" *ngIf="!isLoading">{{ editingOrderId ? 'save' : 'add_shopping_cart' }}</span>
      <span class="spinner-sm" *ngIf="isLoading"></span>
      {{ editingOrderId ? 'Actualizar Pedido' : 'Agregar al Carrito' }}
    </button>
  </div>
</form>
