<div class="account-container">
  @if (isLoading) {
    <div class="loading-overlay">
      <div class="spinner"></div>
      <p>Cargando tu perfil...</p>
    </div>
  } @else if (currentUser) {
    <div class="profile-layout">
      
      <aside class="profile-sidebar">
        <div class="avatar-circle">
          <span class="material-icons">person</span>
        </div>
        <h3>{{ currentUser.name }} {{ currentUser.surname }}</h3>
        <span class="badge-role" [class]="currentUser.role">
          {{ currentUser.role | titlecase }}
        </span>
        
        <div class="sidebar-actions">
          <button (click)="logout()" class="btn-logout">
            <span class="material-icons">logout</span> Cerrar Sesión
          </button>
        </div>
      </aside>

      <main class="profile-main">
        <div class="card-header">
          <h2>{{ isEditing ? 'Editar Perfil' : 'Información Personal' }}</h2>
          @if (!isEditing) {
            <button (click)="toggleEdit()" class="btn-edit-icon">
              <span class="material-icons">edit</span>
            </button>
          }
        </div>

        <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="profile-form">
          <div class="form-grid">
            <div class="form-group">
              <label>Nombre</label>
              <input type="text" formControlName="name" [readonly]="!isEditing" [class.editable]="isEditing">
            </div>

            <div class="form-group">
              <label>Apellido</label>
              <input type="text" formControlName="surname" [readonly]="!isEditing" [class.editable]="isEditing">
            </div>

            <div class="form-group full-width">
              <label>Email (No editable)</label>
              <input type="email" [value]="currentUser.email" disabled class="input-disabled">
            </div>

            <div class="form-group full-width">
              <label>Teléfono</label>
              <input type="text" formControlName="phone" [readonly]="!isEditing" [class.editable]="isEditing">
            </div>
          </div>

          @if (isEditing) {
            <div class="form-actions">
              <button type="button" class="btn-cancel" (click)="toggleEdit()" [disabled]="isSaving">
                Cancelar
              </button>
              <button type="submit" class="btn-save" [disabled]="userForm.invalid || isSaving">
                {{ isSaving ? 'Guardando...' : 'Guardar Cambios' }}
              </button>
            </div>
          }
        </form>
      </main>
    </div>
  }
</div>
