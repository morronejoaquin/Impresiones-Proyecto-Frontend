<div class="history-container">
  <div class="back-button">
    <a routerLink="/admin/prices" class="back">
      <span class="material-icons">arrow_back</span> Volver
    </a>
  </div>  
  <h2 class="tittle">Historial Evolutivo de Precios</h2>
  
  @if(loading) {
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Consultando registros...</p>
    </div>
    } @else if(errorType === 'CONNECTION') {
    <div class="error-state">
      <span class="material-icons">cloud_off</span>
      <p>Error de conexión con el servidor.</p>
      <button (click)="loadHistoryPrices()" class="btn-retry">Reintentar</button>
    </div>

    } @else if(errorType === 'NO_DATA') {
    <div class="empty-state">
      <span class="material-icons">info_outline</span>
      <p>Aún no existen registros históricos de precios.</p>
    </div>

    } @else {
    <div class="line-chart">
      <canvas baseChart
        [data]="lineChartData"
        [options]="lineChartOptions"
        [type]="'line'">
      </canvas>
    </div>
    }
</div>
