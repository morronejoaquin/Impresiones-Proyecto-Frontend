<div class="checkout-container">
  <div class="main-content">
    <h2>¿Cómo querés pagar?</h2>

    <form [formGroup]="cartForm" (ngSubmit)="onSubmit()">
      <div class="payment-options">
        
        <label class="payment-card" [class.selected]="cartForm.get('paymentMethod')?.value === 'MERCADO_PAGO'">
          <div class="radio-container">
            <input type="radio" value="MERCADO_PAGO" formControlName="paymentMethod">
            <span class="custom-radio"></span>
          </div>
          <div class="payment-content">
            <img src="assets/img/mercadopago-logo.png" alt="Mercado Pago" class="payment-logo">
            <div class="payment-text">
              <span class="title">Mercado Pago</span>
              <span class="subtitle">Tarjeta de débito, crédito o dinero en cuenta</span>
            </div>
          </div>
        </label>

        <label class="payment-card" [class.selected]="cartForm.get('paymentMethod')?.value === 'CASH'">
          <div class="radio-container">
            <input type="radio" value="CASH" formControlName="paymentMethod">
            <span class="custom-radio"></span>
          </div>
          <div class="payment-content">
            <div class="cash-icon">💵</div>
            <div class="payment-text">
              <span class="title">Efectivo en el local</span>
              <span class="subtitle">Pagás al retirar tu pedido</span>
            </div>
          </div>
        </label>

      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        @if (isLoading) {
            <span class="spinner"></span> Procesando...
        } @else {
            Confirmar compra
        }
      </button>
    </form>
  </div>

  <aside class="summary-card">
    <h3>Resumen de compra</h3>
    <hr>
    <div class="summary-row">
      <span>Productos</span>
      <span>${{ cartTotal | number:'1.2-2' }}</span>
    </div>
    <div class="summary-row total">
      <span>Total</span>
      <span>${{ cartTotal | number:'1.2-2' }}</span>
    </div>
  </aside>
</div>
